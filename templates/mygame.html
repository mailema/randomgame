<!DOCTYPE html>
<html lang="en">
    <head>
        <title>myboxgame</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <style>
            body{
                min-height:100dvh;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                background-color:lightblue;
                gap:clamp(15px,3dvh,30px)
            }
            .container{
                width:clamp(300px,90vw,800px);
                border:2px solid aliceblue;
                border-radius:3vw;
                display:grid;
                grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
                grid-auto-rows:100px;
                background-color:white;
                gap:20px;
                padding:10px;
            }
            .win{
                background-color:lightgrey;
                border-radius:2vw;
                display:flex;
                justify-content:center;
                align-items:center;
                color:grey;
            }
            .selection{
                background-color:white;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                width:clamp(200px,70vw,600px);
                border:2px solid aliceblue;
                border-radius:3vw;
                padding-top:4vh;
                padding-bottom:6vh;
                font-size:clamp(20px,5vw,30px);
               
            }
            select{
               width:clamp(50px,20vw,100px);
               height:clamp(30px,5dvh,50px);
               font-size:clamp(18px,4vw,25px)
            }
            .bx{
                display:flex;
                flex-direction:column;
                align-items:center;
                background-color:lightgrey;
                box-sizing:border-box;
                border-radius:10px
            }
            .rd{
                color:lightgrey;
            }
            .bt{
               width:clamp(200px,70vw,600px);
               display:flex;
               flex-direction:column;
               justify-content:center;
               align-items:center;
               margin-top:2dvh
            }
            button{
                width:clamp(100px,30vw,150px);
                height:clamp(40px,8dvh,50px);
                border-radius:10px;
                font-size:clamp(20px,4vw,40px);
                box-shadow:0px 0px 10px red;
                border:1px solid red;
            }
            b{
                font-size:clamp(30px,5vw,50px)
            }
        </style>
    </head>
    <body>
        <div class="container">
           <div class="bx">
               <b>1</b>
            <div class="win"><b class="rd"></b></div>
            </div>
            <div class="bx">
               <b>2</b>
            <div class="win"><b class="rd"></b></div>
            </div>
            <div class="bx">
               <b>3</b>
            <div class="win"><b class="rd"></b></div>
            </div>
            <div class="bx">
               <b>4</b>
            <div class="win"><b class="rd"></b></div>
            </div>
            <div class="bx">
               <b>5</b>
            <div class="win"><b class="rd"></b></div>
            </div>
            <div class="bx">
               <b>6</b>
            <div class="win"><b class="rd"></b></div>
            </div>
        </div>
        <form method="POST">
        <div class="selection">
            <h3>choose three boxes</h3>
            <div class="select">
            <select name="first">
                <option value=" "> </option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
            <select name="second">
                <option value=" "> </option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
            <select name="third">
                <option value=" "> </option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
            </div>
        </div>
        <div class="bt">
        <button class="submit">check</button>
        </div>
        </form>
    </body>
</html>
